<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-form">
                <h2>Sign Up</h2>
                <form action="guardar_usuario.php" method="POST" id="formRegistro">
                    <div class="input-group-custom">
                        <label>Nombre y Apellido</label>
                        <input type="text" name="nombre" required autofocus>
                    </div>
                    <div class="input-group-custom">
                        <label>Correo Electrónico</label>
                        <input type="email" name="correo" required>
                    </div>
                    <div class="input-group-custom">
                        <label>Contraseña</label>
                        <input type="password" name="password" id="password" required minlength="8">
                        
                        <!-- NUEVO: Barra de fuerza mejorada -->
                        <div class="password-strength-meter mt-2">
                            <div id="strength-bar" style="height: 6px; width: 0%; transition: 0.3s; border-radius: 3px;"></div>
                        </div>
                        <div id="strength-text" class="mt-1" style="font-size: 13px; font-weight: bold;"></div>
                    </div>
                    <button type="submit" class="btn-orange">Registrarse</button>
                    <div class="text-center mt-3">
                        <a href="login.php" style="color: #00d2ff; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a>
                    </div>
                </form>
            </div>
            <div class="login-welcome blue">
                <h2>HELLO<br>FRIEND!</h2>
                <p>Register with us to start organizing your contacts.</p>
            </div>
        </div>
    </div>

    <!-- Script para medir la fuerza de la contraseña -->
    <script>
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', function() {
            const val = passwordInput.value;
            let strength = 0;

            if (val.length >= 8) strength += 25; // Mínimo 8
            if (val.match(/[a-z]/)) strength += 25; // Minúscula
            if (val.match(/[A-Z]/)) strength += 25; // Mayúscula
            if (val.match(/[0-9]/)) strength += 25; // Número

            strengthBar.style.width = strength + '%';

            if (val.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.innerHTML = '';
            } else if (strength <= 25) {
                strengthBar.style.backgroundColor = '#ff4d4d'; // Rojo
                strengthText.innerHTML = 'Contraseña muy débil';
                strengthText.style.color = '#ff4d4d';
            } else if (strength <= 50) {
                strengthBar.style.backgroundColor = '#ffa64d'; // Naranja
                strengthText.innerHTML = 'Contraseña débil';
                strengthText.style.color = '#ffa64d';
            } else if (strength <= 75) {
                strengthBar.style.backgroundColor = '#ffff4d'; // Amarillo
                strengthText.innerHTML = 'Contraseña regular';
                strengthText.style.color = '#ffff4d';
            } else {
                strengthBar.style.backgroundColor = '#4dff4d'; // Verde
                strengthText.innerHTML = '¡Contraseña fuerte!';
                strengthText.style.color = '#4dff4d';
            }
        });
    </script>
</body>
</html>
